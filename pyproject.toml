[project]
name = "kim-bot"
version = "0.1.0"
description = "rag llm"
readme = "README.md"
requires-python = ">=3.11.0, <3.12"
dependencies = [
    "alive-progress>=3.3.0",
    "chromadb>=1.4.1",
    "click>=8.3.1",
    "docling>=2.70.0",
    "ollama>=0.6.1",
    "pylibmagic>=0.5.0",
    "python-magic>=0.4.27",
    "transformers>=4.57.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[project.scripts]
kim-bot = "kim_bot.main:cli"

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
"sys_platform == 'darwin' and platform_machine == 'arm64'"
]
